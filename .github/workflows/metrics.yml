name: Generate metrics
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          # The rendered SVG has no background rect, so it inherits the page
          # colour. Only the text and calendar palettes need a dark variant.
          - filename: assets/metrics-dark.svg
            css: |
              svg { color: #c9d1d9 }
              h1, h2, h3 { color: #00e5a0 }
              .field svg { fill: #8b949e }
              .calendar .day { outline-color: rgba(255, 255, 255, 0.04) }
              :root {
                --color-calendar-graph-day-bg: #161b22;
                --color-calendar-graph-day-border: rgba(255, 255, 255, 0.05);
                --color-calendar-graph-day-L1-bg: #0e4429;
                --color-calendar-graph-day-L2-bg: #006d32;
                --color-calendar-graph-day-L3-bg: #26a641;
                --color-calendar-graph-day-L4-bg: #39d353;
              }
          - filename: assets/metrics.svg
            css: |
              h1, h2, h3 { color: #059669 }
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: ${{ matrix.filename }}
          committer_branch: main
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Mexico_City
          extras_css: ${{ matrix.css }}
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
