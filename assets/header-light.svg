<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0891b2"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d3dbe6" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="type"><rect class="reveal" x="80" y="230" width="420" height="30"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .sans{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1s steps(2,start) infinite}
      @keyframes blink{to{visibility:hidden}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(-320px)}to{transform:translateY(320px)}}
      .ring{animation:spin 24s linear infinite;transform-origin:1040px 160px}
      .ring-rev{animation:spin 36s linear infinite reverse;transform-origin:1040px 160px}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
      .bar{animation:grow 4s ease-out infinite;transform-origin:80px 279px}
      @keyframes grow{0%{transform:scaleX(0)}55%,100%{transform:scaleX(1)}}
      .reveal{animation:type 4s steps(28) infinite;transform-origin:80px 245px}
      @keyframes type{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.6"/>
  <rect class="scan" width="1200" height="60" fill="url(#accent)" opacity="0.05"/>
  <circle class="pulse" cx="1040" cy="160" r="150" fill="none" stroke="url(#accent)" stroke-width="1"/>
  <circle class="ring" cx="1040" cy="160" r="110" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.3" stroke-dasharray="6 8"/>
  <circle class="ring-rev" cx="1040" cy="160" r="130" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.18" stroke-dasharray="2 14"/>
  <circle cx="1040" cy="160" r="70" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
  <text x="1040" y="176" text-anchor="middle" class="mono" font-size="44" font-weight="700" fill="url(#accent)" filter="url(#glow)">&lt;/&gt;</text>
  <text x="80" y="92" class="mono" font-size="18" fill="#059669">$ whoami</text>
  <text x="80" y="150" class="sans" font-size="56" font-weight="800" fill="#0f172a" letter-spacing="-1">Damian Torres</text>
  <text x="80" y="196" class="sans" font-size="22" fill="#475569">Founder &amp; CEO @ DMLABS · Full-Stack Engineer · Offensive Security</text>
  <g clip-path="url(#type)">
    <text x="80" y="250" class="mono" font-size="18" fill="#059669">$ ./build --break --harden</text>
  </g>
  <text x="332" y="250" class="mono cursor" font-size="18" fill="#059669">█</text>
  <rect class="bar" x="80" y="278" width="220" height="3" fill="url(#accent)" rx="2"/>
</svg>
