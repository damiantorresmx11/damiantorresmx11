<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5a0"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2a3a" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .sans{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1s steps(2,start) infinite}
      @keyframes blink{to{visibility:hidden}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(-320px)}to{transform:translateY(320px)}}
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.6"/>
  <rect class="scan" width="1200" height="60" fill="url(#accent)" opacity="0.05"/>
  <circle cx="1040" cy="160" r="150" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.35"/>
  <circle cx="1040" cy="160" r="110" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.25" stroke-dasharray="6 8"/>
  <circle cx="1040" cy="160" r="70" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
  <text x="1040" y="176" text-anchor="middle" class="mono" font-size="44" font-weight="700" fill="url(#accent)" filter="url(#glow)">&lt;/&gt;</text>
  <text x="80" y="92" class="mono" font-size="18" fill="#00e5a0">$ whoami</text>
  <text x="80" y="150" class="sans" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">Damian Torres</text>
  <text x="80" y="196" class="sans" font-size="22" fill="#94a3b8">Founder &amp; CEO @ DMLABS · Full-Stack Engineer · Offensive Security</text>
  <text x="80" y="250" class="mono" font-size="18" fill="#00e5a0">$ ./build --break --harden<tspan class="cursor">█</tspan></text>
  <rect x="80" y="278" width="220" height="3" fill="url(#accent)" rx="2"/>
</svg>
